name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, tipos, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run type-check
      - name: Tests con cobertura
        run: npm run test:cobertura
        env:
          # Todos los escenarios Gherkin están implementados (plan 10): un paso sin definir
          # hace fallar su escenario en cualquier rama.
          GHERKIN_ESTRICTO: '1'
      - name: Aceptación sobre Dexie
        # Los mismos 158 casos de los .feature sobre IndexedDB (fake-indexeddb) en vez de memoria.
        run: npx vitest run tests/aceptacion
        env:
          ACEPTACION_ALMACEN: dexie
          GHERKIN_ESTRICTO: '1'
      - run: npm run build-only
      # RN-SIS-09: lo que se descarga al abrir y lo que precachea el service worker (lee dist/).
      - run: npm run test:build

  specs:
    name: Specs (cada regla tiene escenario)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # verificar-specs usa @cucumber/gherkin para leer las etiquetas: necesita las dependencias.
      - run: npm ci
      - run: npm run verificar-specs

  e2e:
    name: E2E (celular y PC)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-only
      - run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reporte-playwright
          path: frontend/playwright-report
          retention-days: 7

  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
